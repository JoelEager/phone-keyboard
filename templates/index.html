<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
        }
        form {
            background: #1e1e1e;
            color: #e0e0e0;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            background-color: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 10px;
            resize: vertical;
        }
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #bb86fc;
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
        }
        input[type="submit"]:active {
            background-color: #9965f4;
        }
    </style>
</head>
<body>
    <form action="/submit" method="post">
        <textarea name="text" rows="10" placeholder="Type here..."></textarea><br>
        <input type="submit" value="Post">
    </form>
</body>
</html>
