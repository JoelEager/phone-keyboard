<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <title>Phone Keyboard</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 10px;
            box-sizing: border-box;
            background-color: #121212;
        }
        form {
            background: #1e1e1e;
            color: #e0e0e0;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 400px;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            background-color: #2c2c2c;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 10px;
            resize: vertical;
        }
        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #bb86fc;
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
        }
        input[type="submit"]:active {
            background-color: #9965f4;
        }
        #wake-lock-status {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 10px;
        }
        #wake-lock-status.active {
            color: #4caf50;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .checkbox-container input {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <form action="/type" method="post">
        <textarea id="message_text" name="text" rows="10" placeholder="Type here..." autocapitalize="sentences"></textarea><br>
        <div class="checkbox-container">
            <input type="checkbox" id="use_shift_enter" name="use_shift_enter" checked>
            <label for="use_shift_enter">Use Shift+Enter for newlines</label>
        </div>
        <div class="checkbox-container">
            <input type="checkbox" id="autocapitalize_toggle" checked>
            <label for="autocapitalize_toggle">Auto-capitalize first word</label>
        </div>
        <input type="submit" value="Post">
        <div id="wake-lock-status">Stay Awake: Inactive</div>
    </form>
    <script>
        let wakeLock = null;
        let isEnabled = false;
        const statusElem = document.getElementById('wake-lock-status');

        const updateStatus = (active, message) => {
            statusElem.textContent = `Stay Awake: ${message || (active ? 'Active' : 'Inactive')}`;
            if (active) {
                statusElem.classList.add('active');
            } else {
                statusElem.classList.remove('active');
            }
        };

        const requestWakeLock = async () => {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    updateStatus(true);
                    wakeLock.addEventListener('release', () => {
                        if (document.visibilityState === 'visible') {
                            updateStatus(false);
                        }
                    });
                } catch (err) {
                    console.error(`${err.name}, ${err.message}`);
                    updateStatus(false, 'Error');
                }
            } else {
                updateStatus(false, 'Not Supported');
            }
        };

        const handleInteraction = () => {
            isEnabled = true;
            requestWakeLock();
            document.removeEventListener('click', handleInteraction);
            document.removeEventListener('touchstart', handleInteraction);
        };

        document.addEventListener('click', handleInteraction);
        document.addEventListener('touchstart', handleInteraction);

        document.addEventListener('visibilitychange', async () => {
            if (isEnabled && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        const textarea = document.getElementById('message_text');
        const autocapitalizeToggle = document.getElementById('autocapitalize_toggle');

        autocapitalizeToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                textarea.setAttribute('autocapitalize', 'sentences');
            } else {
                textarea.setAttribute('autocapitalize', 'none');
            }
        });
    </script>
</body>
</html>
